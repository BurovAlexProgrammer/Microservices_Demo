version: '3.8'

services:
  nginx:
    image: nginx:latest
    container_name: nginx
    ports:
      - 80:80
      - 443:443
    volumes:
      #      - ./nginx/nginx.linux.conf:/etc/nginx/nginx.conf:ro  //OS depended
      - nginx_conf:./nginx/nginx.windows.conf:/etc/nginx/nginx.conf:ro  //OS depended

volumes:
  nginx_conf:
