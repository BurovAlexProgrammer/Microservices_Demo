version: '3.8'

services:
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
    ports:
      - "2181:2181"

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENERS: PLAINTEXT://:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

  postgres_chat:
    image: postgres:15
    environment:
      POSTGRES_DB: chatdb
      POSTGRES_USER: chatuser
      POSTGRES_PASSWORD: chatpass
    ports:
      - "5433:5432"
    volumes:
      - chat_pgdata:/var/lib/postgresql/data

  postgres_user:
    image: postgres:15
    environment:
      POSTGRES_DB: userdb
      POSTGRES_USER: useruser
      POSTGRES_PASSWORD: userpass
    ports:
      - "5434:5432"
    volumes:
      - user_pgdata:/var/lib/postgresql/data

  authservice:
    build:
      context: ./services/AuthService
    ports:
      - "5001:80"
    depends_on:
      - postgres_user

  chatservice:
    build:
      context: ./services/ChatService
    ports:
      - "5002:80"
    depends_on:
      - kafka
      - postgres_chat

  userservice:
    build:
      context: ./services/UserService
    ports:
      - "5003:80"
    depends_on:
      - postgres_user

volumes:
  chat_pgdata:
  user_pgdata:
